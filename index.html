#splash{position:fixed;inset:0;z-index:200;background:#2a1233;display:none;align-items:center;justify-content:center}

    for(const x of names){if(!x)continue;if(x===n)sc=Math.max(sc,3);else if(x.startsWith(n)||n.startsWith(x))sc=Math.max(sc,2);else if(x.includes(n)||(x.length>3&&n.includes(x)))sc=Math.max(sc,1);}
    if(sc)out.push({k,sc});
  }
  return out.sort((a,b)=>b.sc-a.sc).map(x=>x.k);
}

/* ================= LOGICA ================= */
function waterInterval(p){
  if(p.waterDays)return p.waterDays;
  const c=CAT[p.key];if(!c)return null;
  const m=new Date().getMonth()+1;
  return (m>=4&&m<=9)?c.waterSummer:c.waterWinter;
}
function compute(){
  const m=new Date().getMonth()+1,list=[],alerts=[],cold=[];
  for(const p of S.plants){
    const c=CAT[p.key]||null;
    const wi=waterInterval(p);
    if(wi&&daysSince(p.lastWater)>=wi){
      let sub=c&&c.tipoAcqua&&p.key==='nepenthes'?c.tipoAcqua:(CAT[p.key]?'':'');
      if(W&&p.outdoor&&W.rain>=2)sub='Oggi piove: guarda se la terra è già bagnata.';
      list.push({id:p.id,kind:'acqua',title:'Annaffia '+p.name,sub});
    }
    if(c&&c.fertDays&&c.fertMonths.includes(m)&&daysSince(p.lastFert)>=c.fertDays)
      list.push({id:p.id,kind:'concime',title:'Concima '+p.name,sub:c.concime});
    if(c&&c.prune&&c.prune.months.includes(m)&&daysSince(p.lastPrune)>=c.prune.every)
      list.push({id:p.id,kind:'potatura',title:c.prune.label+': '+p.name,sub:c.potatura});
    if(W&&p.outdoor&&c&&c.tMin!=null&&W.min<c.tMin)cold.push(p.name);
  }
  if(cold.length)alerts.push({id:'freddo',text:'Minima di '+Math.round(W.min)+' °C nelle prossime 24 ore: porta dentro '+cold.join(', ')+'.'});
  return{list,alerts};
}
function statusOf(p){
  const c=CAT[p.key],m=new Date().getMonth()+1,wi=waterInterval(p);
  if(wi&&daysSince(p.lastWater)>=wi)return{t:'Annaffia oggi',due:true};
  if(c&&c.fertDays&&c.fertMonths.includes(m)&&daysSince(p.lastFert)>=c.fertDays)return{t:'Concima oggi',due:true};
  if(c&&c.prune&&c.prune.months.includes(m)&&daysSince(p.lastPrune)>=c.prune.every)return{t:c.prune.label+' oggi',due:true};
  if(wi){const left=wi-daysSince(p.lastWater);return{t:left===1?'Annaffia domani':'Annaffia tra '+left+' giorni',due:false};}
  if(!c)return{t:'Imposta ogni quanti giorni annaffiare',due:false};
  if(p.key==='incenso')return{t:'Imposta ogni quanti giorni annaffiare',due:false};
  return{t:'Per ora niente da fare',due:false};
}

async function loadWeather(force){
  if(!S.loc){W=null;return;}
  const key=S.loc.lat+','+S.loc.lon;let c=null;
  try{c=JSON.parse(localStorage.getItem('pp_wx')||'null');}catch(e){}
  if(!force&&c&&c.k===key&&Date.now()-c.t<18e5){W=c.w;return;}
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+S.loc.lat+'&longitude='+S.loc.lon+'&current=temperature_2m,weather_code&hourly=temperature_2m&daily=precipitation_sum&forecast_days=2&timezone=auto';
    const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();
    let i=j.hourly.time.findIndex(t=>t>=j.current.time);if(i<0)i=0;
    const nx=j.hourly.temperature_2m.slice(i,i+24);
    W={temp:j.current.temperature_2m,code:j.current.weather_code,min:Math.min.apply(null,nx),rain:(j.daily.precipitation_sum||[0])[0]||0};
    localStorage.setItem('pp_wx',JSON.stringify({t:Date.now(),k:key,w:W}));
  }catch(e){W=c&&c.k===key?c.w:null;}
}
function useGeo(){
  if(!navigator.geolocation){toast('Questo telefono non dà la posizione.');return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=+pos.coords.latitude.toFixed(3),lon=+pos.coords.longitude.toFixed(3);
    let name='La tua posizione';
    try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=it&lat='+lat+'&lon='+lon);const j=await r.json();const a=j.address||{};name=a.city||a.town||a.village||a.municipality||j.name||name;}catch(e){}
    S.loc={lat,lon,name};save();closeModal();await loadWeather(true);render();notifyToday();
  },err=>{
    const m={1:'Opera non ha il permesso di leggere la posizione. Tocca il lucchetto (o i tre puntini) vicino all\'indirizzo del sito, poi "Impostazioni sito" e "Posizione", e scegli "Consenti". Poi riprova.',2:'Il telefono non riesce a trovare la posizione. Controlla che la Posizione (GPS) del telefono sia accesa e riprova.',3:'Ci mette troppo a trovare la posizione. Riprova, meglio vicino a una finestra.'};
    toast((m[err&&err.code]||'Non riesco a leggere la posizione.')+' Intanto puoi cercare la città a mano.');
  },{timeout:20000,maximumAge:6e5,enableHighAccuracy:false});
}
async function searchCity(q){

    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=it&format=json&name='+encodeURIComponent(q));
    const j=await r.json();const rs=j.results||[];
    box.innerHTML=rs.length?rs.map(x=>'<button class="pick" data-act="city" data-lat="'+x.latitude+'" data-lon="'+x.longitude+'" data-name="'+esc(x.name)+'"><b>'+esc(x.name)+'</b><span class="sub">'+esc([x.admin1,x.country].filter(Boolean).join(', '))+'</span></button>').join(''):'<p class="sub">Nessuna città trovata.</p>';

/* ================= FOTO ================= */
async function photoFor(titles){
  for(const t of titles){
    const k='img:'+t;const v=localStorage.getItem(k);
    if(v==='none')continue;if(v)return v;
    let netErr=false,found=null;
    for(const lang of['it','en']){
      try{
        const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')));
        if(!r.ok)continue;const j=await r.json();
        if(j.thumbnail&&j.thumbnail.source){found=j.thumbnail.source;break;}
      }catch(e){netErr=true;}
    }
    if(found){try{localStorage.setItem(k,found);}catch(e){}return found;}
    if(!netErr)try{localStorage.setItem(k,'none');}catch(e){}
  }
  return null;
}
async function commonsPhoto(f){
  const k='cimg2:'+f.q,v=localStorage.getItem(k);
  if(v==='none')return null;if(v)return JSON.parse(v);
  try{
    const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(f.q)+'&prop=imageinfo&iiprop=url|mime&iiurlwidth=400&format=json&origin=*';
    const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();
    const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
    for(const pg of pages){
      const t=(pg.title||'').toLowerCase(),ii=pg.imageinfo&&pg.imageinfo[0];
      if(!ii||!/jpeg|png/.test(ii.mime||''))continue;
      if(/tic tac|candy|ice cream|gelato|tea|sauce|soup|salad|pesto|logo|packag|bottle|jar|\bcup\b|drink|cocktail|dish|bread|pizza|cake/.test(t))continue;
      if(!/plant|leaf|leaves|herb|ocimum|growing|garden/.test(t))continue;
      if(f.must.every(g=>g.some(w=>t.includes(w)))){const res={u:ii.thumburl||ii.url};try{localStorage.setItem(k,JSON.stringify(res));}catch(e){}return res;}
    }
    try{localStorage.setItem(k,'none');}catch(e){}
    return null;
  }catch(e){return null;}
}
function hydrate(){
  document.querySelectorAll('[data-ph],[data-foto]').forEach(async el=>{
    if(el.dataset.done)return;el.dataset.done='1';
    let u=null;
    try{
      if(el.dataset.foto){const r=await commonsPhoto(JSON.parse(el.dataset.foto));u=r&&r.u;}
      else u=await photoFor(JSON.parse(el.dataset.ph));
    }catch(e){}
    if(u&&el.isConnected){el.style.backgroundImage='url("'+u+'")';el.classList.add('has');}
  });
}
function shrink(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82));};img.onerror=rej;img.src=u;});}
function ph(p,s){
  const st='width:'+s+'px;height:'+s+'px',c=CAT[p.key];
  if(p.photo)return '<div class="ph has" style="'+st+";background-image:url('"+p.photo+"')"+'">'+LEAF+'</div>';

async function notifyToday(force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const d=todayStr();if(!force&&localStorage.getItem('pp_notif')===d)return;
  const{list,alerts}=compute();if(!list.length&&!alerts.length)return;
  let reg=null;try{reg=await navigator.serviceWorker.getRegistration();}catch(e){}
  const show=async(t,b,tag)=>{try{if(reg)await reg.showNotification(t,{body:b,tag,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(t,{body:b,tag});}catch(e){}};
  for(const a of alerts.slice(0,3))await show('Attenzione',a.text,'a'+a.id);
  for(const t of list.slice(0,6))await show('Oggi: '+t.title.charAt(0).toLowerCase()+t.title.slice(1),t.sub||'','t'+t.id+t.kind);
  if(list.length>6)await show('Altre cose da fare','Altre '+(list.length-6)+' cose oggi nell\'app.','more');
  try{localStorage.setItem('pp_notif',d);}catch(e){}
}
async function enableNotif(){
  if(!('Notification' in window)){toast('Questo browser non supporta le notifiche.');return;}
  const r=await Notification.requestPermission();
  if(r==='granted'){await notifyToday(true);toast('Notifiche attive.');}else toast('Notifiche non permesse.');
  render();
}

  let c=null;try{c=JSON.parse(localStorage.getItem('pp_trjwt'));}catch(e){}

    const j=await trGet('plants/search',{q:q});
    const L=(j.data||[]).slice(0,10);
    box.innerHTML=L.length?L.map(x=>'<button class="pick" data-act="addt" data-id="'+esc(x.id)+'" data-n="'+esc(x.common_name||x.scientific_name)+'" data-s="'+esc(x.scientific_name||'')+'"><b>'+esc(cap(x.common_name||x.scientific_name))+'</b><span class="sub">'+esc(x.scientific_name||'')+'</span></button>').join(''):'<p class="sub">Trefle non ha trovato niente.</p>';
  }catch(e){
    box.innerHTML='<p class="sub">Non riesco a collegarmi a Trefle ('+esc(e.message||'errore')+'). Può essere che il sito non permetta le richieste da un\'app web.</p>';
  }
}
async function trDetails(id,sci,name){
  const t={id:id,s:sci,n:name};
  try{
    const j=await trGet('plants/'+id,{});const d=j.data||{},ms=d.main_species||{},g=ms.growth||{},sp=ms.specifications||{};
    t.fam=d.family_common_name||d.family||ms.family||null;
    t.light=g.light;t.hum=g.ground_humidity;t.atm=g.atmospheric_humidity;t.nut=g.soil_nutriments;
    t.tmin=g.minimum_temperature&&g.minimum_temperature.deg_c;
    t.phmin=g.ph_minimum;t.phmax=g.ph_maximum;
    t.gm=g.growth_months||null;t.bm=g.bloom_months||null;
    t.dur=ms.duration||null;t.tox=sp.toxicity||null;t.edible=ms.edible;
  }catch(e){t.err=String(e.message||e);}
  return t;
}
function trMonths(a){return (a||[]).map(x=>TRM[String(x).toLowerCase().slice(0,3)]||x).join(', ');}
function trHTML(t){
  let h='<div class="badge o" style="align-self:flex-start">Dati dal database Trefle: non controllati da me</div>';
  const n=v=>v!=null&&v!=='';
  const rows=[];
  if(n(t.light))rows.push(['Luce',t.light+' su 10 (0 = buio, 10 = luce molto forte)']);
  if(n(t.hum))rows.push(['Umidità del terreno',t.hum+' su 10 (0 = molto secco, 10 = sommerso)']);
  if(n(t.atm))rows.push(['Umidità dell\'aria',t.atm+' su 10 (0 = molto secca, 10 = molto umida)']);
  if(n(t.nut))rows.push(['Nutrienti nel terreno',t.nut+' su 10 (0 = povero, 10 = molto ricco)']);
  if(n(t.phmin)||n(t.phmax))rows.push(['pH del terreno','da '+(n(t.phmin)?t.phmin:'?')+' a '+(n(t.phmax)?t.phmax:'?')]);
  if(n(t.tmin))rows.push(['Temperatura minima',t.tmin+' °C (secondo Trefle)']);
  if(t.gm&&t.gm.length)rows.push(['Mesi di crescita',trMonths(t.gm)]);
  if(t.bm&&t.bm.length)rows.push(['Mesi di fioritura',trMonths(t.bm)]);
  if(n(t.dur)){const d=Array.isArray(t.dur)?t.dur:[t.dur];rows.push(['Durata',d.map(x=>TRD[String(x).toLowerCase()]||x).join(', ')]);}
  if(n(t.fam))rows.push(['Famiglia',t.fam]);
  if(!rows.length&&t.edible==null&&!t.tox){h+='<div class="warn">'+(t.err?'Non sono riuscito a leggere i dati di questa pianta ('+esc(t.err)+').':'Trefle non ha dati di cura per questa pianta. Puoi impostare tu ogni quanti giorni annaffiarla.')+'</div>';return h;}
  h+=rows.map(x=>r(x[0],x[1])).join('');
  if(t.tox)h+='<div class="warn"><b>Tossicità (secondo Trefle):</b> '+esc(TRT[String(t.tox).toLowerCase()]||t.tox)+'.</div>';
  if(t.edible!=null)h+=r('Commestibile',t.edible?'Sì, qualche parte (controlla quale prima di mangiarla)':'No');
  return h;
}

async function searchPlants(q){
  const box=$('#res');if(q.trim().length<2){return;}
  const mine=findCat(q).slice(0,8).map(k=>'<button class="pick" data-act="addc" data-k="'+esc(k)+'"><b>'+esc(cap(CAT[k].nome))+'</b><span class="sub">Con scheda di cura'+(CAT[k].verificata?' controllata':' generale (da verificare)')+'</span></button>').join('');
  box.innerHTML=mine+'<p class="sub">Cerco anche su Wikipedia...</p>';
  const hits=[];
  for(const lang of['it','en']){
    try{
      const rr=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=6&srsearch='+encodeURIComponent(q+' pianta botanica'));
      const j=await rr.json();(j.query&&j.query.search||[]).forEach(x=>hits.push({t:x.title,l:lang,s:x.snippet.replace(/<[^>]+>/g,'')}));
    }catch(e){}
  }
  if(q!==$('#q').value)return;
  const seen={};const wiki=hits.filter(x=>{const f=findCat(x.t)[0];if(f&&norm(x.t)===norm(CAT[f].sci||''))return false;if(seen[x.t])return false;seen[x.t]=1;return true;}).slice(0,10).map(x=>'<button class="pick" data-act="addp" data-t="'+esc(x.t)+'"><b>'+esc(x.t)+'</b><span class="sub">Senza scheda di cura. '+esc(x.s.slice(0,70))+'</span></button>').join('');
  box.innerHTML=(mine+wiki||'<p class="sub">Niente trovato.</p>')+'<button class="btn l" style="margin-top:10px" data-act="pxsearch">Cerca anche in Perenual (database grande)</button><div id="pxres"></div>'+'<button class="btn l" style="margin-top:10px" data-act="trsearch">Cerca anche in Trefle (database grande)</button><div id="trres"></div>';
}

function render(){
  const h=location.hash||'#/';
  const sp=$('#splash');if(sp)sp.classList.toggle('on',h==='#/start');if(h==='#/start')return;
  if(h==='#/mie14'){START.forEach(k=>{if(CAT[k]&&!S.plants.some(x=>x.key===k)){S.next=(S.next||100)+1;const o=mk(k,0);o.id='p'+S.next;S.plants.push(o);}});save();location.hash='#/';return;}
  const m=h.match(/^#\/p\/([^/]+)\/(s|h|c)$/);
  let html;
  if(m){const p=S.plants.find(x=>x.id===m[1]);if(!p){location.hash='#/';return;}const c=CAT[p.key]||null;html=m[2]==='s'?schedaHTML(p,c):m[2]==='h'?saluteHTML(p,c):crescitaHTML(p,c);}
  else if(h==='#/add')html=addHTML();
  else html=homeHTML();
  $('#app').innerHTML=html;window.scrollTo(0,0);hydrate();
}
function rerender(){const y=window.scrollY;const a=document.activeElement;const id=a&&a.id;render();window.scrollTo(0,y);}

/* ================= EVENTI ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act,id=b.dataset.id,p=id&&S.plants.find(x=>x.id===id);
  if(a==='enter'){location.hash='#/';return;}
  if(a==='close'){closeModal();return;}
  if(a==='pota'&&p){openModal(potaHTML(p));return;}
  if(a==='geo'){useGeo();return;}
  if(a==='refresh'){await loadWeather(true);rerender();return;}
  if(a==='notif'){enableNotif();return;}
  if(a==='citybox'){openModal('<h2 style="margin:0">Dove sei?</h2><input type="search" id="city" placeholder="Città (es. Milano)"><div id="cityres" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn l" data-act="geo">Usa la posizione del telefono</button><button class="btn l" data-act="close">Chiudi</button>');return;}
  if(a==='city'){S.loc={lat:+(+b.dataset.lat).toFixed(3),lon:+(+b.dataset.lon).toFixed(3),name:b.dataset.name};save();closeModal();await loadWeather(true);render();notifyToday();return;}
  if(a==='rename'&&p){openModal('<h2 style="margin:0">Nome della pianta</h2><input type="text" id="nn" maxlength="40" value="'+esc(cap(p.name))+'"><div class="row"><button class="btn" data-act="rensave" data-id="'+p.id+'">Salva</button><button class="btn l" data-act="close">Annulla</button></div>');return;}
  if(a==='rensave'&&p){const v=$('#nn').value.trim();if(v){p.name=v;save();}closeModal();rerender();return;}
  if(a==='done'&&p){const k=b.dataset.kind,t=todayStr();if(k==='acqua')p.lastWater=t;else if(k==='concime')p.lastFert=t;else if(k==='potatura')p.lastPrune=t;else if(k==='controllo')p.lastCheck=t;save();rerender();return;}
  if(a==='setwater'&&p){const v=parseInt($('#wd').value,10);p.waterDays=v>0?Math.min(v,90):null;save();rerender();return;}
  if(a==='measure'&&p){const v=parseFloat($('#cm').value);if(!(v>0))return;p.growth=p.growth.filter(x=>x.d!==todayStr());p.growth.push({d:todayStr(),cm:+v.toFixed(1)});save();rerender();return;}
  if(a==='issue'&&p){const c=CAT[p.key];p.issues.push({t:c.problemi[+b.dataset.k][0],d:todayStr(),done:false});save();rerender();return;}
  if(a==='resolve'&&p){p.issues[+b.dataset.k].done=true;save();rerender();return;}
  if(a==='del'&&p){openModal('<h2 style="margin:0">Eliminare '+esc(cap(p.name))+'?</h2><div class="row"><button class="btn r" data-act="delok" data-id="'+p.id+'">Sì, elimina</button><button class="btn l" data-act="close">No</button></div>');return;}
  if(a==='delok'&&p){S.plants=S.plants.filter(x=>x.id!==p.id);save();closeModal();location.hash='#/';return;}
  if(a==='pickphoto'&&p){photoId=p.id;$('#file').click();return;}
  if(a==='rmphoto'&&p){p.photo=null;save();rerender();return;}
  if(a==='trsearch'){trSearch(($('#q').value||'').trim());return;}
  if(a==='addt'){
    const id=b.dataset.id,n=b.dataset.n,sci=b.dataset.s;
    b.disabled=true;b.querySelector('.sub').textContent='Leggo i dati...';
    const tr=await trDetails(id,sci,n);
    S.next=(S.next||100)+1;
    const o={id:'p'+S.next,key:'custom',name:n,wiki:[sci||n],outdoor:false,lastWater:todayStr(),lastFert:null,lastPrune:null,lastCheck:null,waterDays:null,growth:[],issues:[],tr:tr};
    S.plants.push(o);save();location.hash='#/p/'+o.id+'/s';return;
  }
  if(a==='pxsearch'){pxSearch(($('#q').value||'').trim());return;}
  if(a==='addx'){
    const id=b.dataset.id,n=b.dataset.n,sci=b.dataset.s;
    b.disabled=true;b.querySelector('.sub').textContent='Leggo i dati...';
    const px=await pxDetails(id,sci,n);
    S.next=(S.next||100)+1;
    const o={id:'p'+S.next,key:'custom',name:n,wiki:[sci||n],outdoor:false,lastWater:todayStr(),lastFert:null,lastPrune:null,lastCheck:null,waterDays:null,growth:[],issues:[],px:px};
    const m=px.wb&&String(px.wb).match(/(\d+)\s*-\s*(\d+)/);const m1=!m&&px.wb&&String(px.wb).match(/(\d+)/);
    if(m&&/day/i.test(px.wb))o.waterDays=Math.round((+m[1]+ +m[2])/2);else if(m1&&/day/i.test(px.wb))o.waterDays=+m1[1];
    S.plants.push(o);save();location.hash='#/p/'+o.id+'/s';return;
  }
  if(a==='addc'){const k=b.dataset.k;if(!CAT[k])return;S.next=(S.next||100)+1;const o=mk(k,0);o.id='p'+S.next;S.plants.push(o);save();location.hash='#/p/'+o.id+'/s';return;}
  if(a==='addp'){const t=b.dataset.t;const f=findCat(t)[0];if(f&&norm(t)===norm(CAT[f].sci||'')){S.next=(S.next||100)+1;const o=mk(f,0);o.id='p'+S.next;S.plants.push(o);save();location.hash='#/p/'+o.id+'/s';return;}S.next=(S.next||100)+1;S.plants.push({id:'p'+S.next,key:'custom',name:t,wiki:[t],outdoor:false,lastWater:null,lastFert:null,lastPrune:null,lastCheck:null,waterDays:null,growth:[],issues:[]});save();location.hash='#/p/p'+S.next+'/s';return;}
});
document.addEventListener('change',e=>{
  const b=e.target;if(b.dataset&&b.dataset.act==='outdoor'){const p=S.plants.find(x=>x.id===b.dataset.id);if(p){p.outdoor=b.checked;save();}}
});
let tmr=null,photoId=null;
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';const p=S.plants.find(x=>x.id===photoId);if(!f||!p)return;try{p.photo=await shrink(f,360);save();rerender();}catch(err){toast('Non riesco a leggere la foto.');}});
document.addEventListener('input',e=>{
  if(e.target.id==='city'){clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>searchCity(v),350);}
  if(e.target.id==='q'){clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>searchPlants(v),400);}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
if(!location.hash||location.hash==='#'||location.hash==='#/')location.hash='#/start';
window.addEventListener('hashchange',render);
document.addEventListener('visibilitychange',async()=>{if(!document.hidden){await loadWeather(false);if(!location.hash.startsWith('#/p/')&&location.hash!=='#/add')render();notifyToday();}});

/* ================= AVVIO ================= */
(async function(){
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
  render();
  await loadWeather(false);
  if(!location.hash.startsWith('#/p/')&&location.hash!=='#/add')render();
  notifyToday();
  setInterval(async()=>{await loadWeather(false);notifyToday();},30*60*1000);
})();
</script>
